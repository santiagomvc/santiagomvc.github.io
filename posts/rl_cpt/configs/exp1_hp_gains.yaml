# Experiment 1: Risk Aversion for High-Probability Gains
#
# CPT Fourfold Pattern: risk aversion when gains are probable.
#   - Value concavity (x^0.88) compresses large gains
#   - Probability weighting underweights high p: w+(0.99) < 0.99
#   - Reference point=25 creates mixed domain for phi computation:
#     cliff outcomes (return ~3-5) become deep "losses" vs reference,
#     amplified by loss aversion (lambda=2.25). Success outcomes
#     (return ~31-59) become "gains", compressed by x^0.88.
#
# Grid: 5x5 with 4 viable rows
# EV prefers row 3 (risky, 2.76% margin), CPT prefers row 2 (safe, 15.33% margin)
#
# Results (4 seeds, 80 episodes each):
#   REINFORCE: Path1=100% (row 3, risky) | Success=88% Cliff=12%
#   CPT-PG:    Path2=89% (row 2, safe)   | Success=95% Cliff=5%
#   Mann-Whitney U: p < 1e-29, Cohen's d = 3.97

env:
  shape: [5, 5]
  stochasticity: windy
  reward_cliff: 5
  reward_step: 0
  reward_goal: 100
  wind_prob: 0.05

training:
  timesteps: 750000
  n_eval_episodes: 20
  batch_size: 64
  entropy_coef: 0.5
  entropy_coef_final: 0.01
  n_seeds: 4

agent_config:
  lr: 0.0005
  gamma: 0.90
  baseline_type: ema
  alpha: 0.88
  beta: 0.88
  lambda_: 2.25
  reference_point: 25.0
  w_plus_gamma: 0.61
  w_minus_gamma: 0.69
  center_phi: true
  augmented_state: false

agents:
  - reinforce
  - cpt-pg
