# Experiment 5: Loss Aversion (mixed domain via reference point shift)
#
# CPT loss aversion: lambda=2.25 means losses loom 2.25x larger than gains.
# With reference_point=-20 in a losses domain, success returns (~ -10 to -12)
# become "gains" (above ref) and cliff returns (~ -32) become "losses" (below ref).
# Lambda amplifies cliff losses, pushing CPT toward safer paths.
#
# Control: lambda=1.0 (no loss aversion) should behave more like REINFORCE.
#
# Grid: 4x8, wind=0.10, gamma=0.98
# EV prefers row 1 (3.29% margin), CPT(2.25) prefers row 0 (7.00% margin)
# CPT(1.0) prefers row 1 (same as EV)
#
# Results (4 seeds, 80 episodes each):
#   REINFORCE:         Path2=65% (row 1) | mean row=0.72
#   CPT-PG (lam=2.25): Path3=81% (row 0) | mean row=0.17
#   CPT-PG (lam=1.0):  Path3=55%, Path2=42% | mean row=0.47
#   Kruskal-Wallis: p = 3.30e-10
#   REINFORCE vs CPT(2.25): Mann-Whitney p = 1.99e-11, Cohen's d = 1.17

env:
  shape: [4, 8]
  stochasticity: windy
  reward_cliff: -30
  reward_step: -1
  reward_goal: -1
  wind_prob: 0.10

training:
  timesteps: 500000
  n_eval_episodes: 20
  batch_size: 64
  entropy_coef: 0.5
  entropy_coef_final: 0.01
  n_seeds: 16

agent_config:
  lr: 0.0005
  gamma: 0.98
  baseline_type: ema
  alpha: 0.88
  beta: 0.88
  lambda_: 2.25
  reference_point: -20.0
  w_plus_gamma: 0.61
  w_minus_gamma: 0.69
  center_phi: true
  augmented_state: false

agents:
  - reinforce
  - cpt-pg
  - cpt-pg:
      lambda_: 1.0
