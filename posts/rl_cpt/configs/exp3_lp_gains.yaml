# Experiment 3: Risk Seeking for Low-Probability Gains
#
# CPT Fourfold Pattern: risk seeking when gains are improbable.
#
# Mechanism: Negative step reward (step=-1) with small cliff consolation (cliff=3).
# Reference point (40.75) near risky row's success return puts all outcomes in
# CPT "loss" territory. Diminishing sensitivity (alpha=beta=0.88) compresses
# large losses more, making the risky row's cliff return (-1.50) appear much less
# bad relative to its success return than the EV-preferred row's cliff return
# (-3.77). Probability overweighting of row 5's ~44% cliff rate amplifies this,
# tipping CPT to prefer the riskier row.
#
# Grid: 7x7, step=-1, goal=100, cliff=3, wind=0.11, gamma=0.90
# Env-verified (20K episodes per row):
#   Row 0: EV=3.71,  P(succ)=100%,  R_succ=3.71,  R_cliff=0.00
#   Row 1: EV=7.39,  P(succ)=100%,  R_succ=7.39,  R_cliff=0.00
#   Row 2: EV=11.97, P(succ)=99.9%, R_succ=11.98, R_cliff=-6.56
#   Row 3: EV=17.67, P(succ)=99.2%, R_succ=17.86, R_cliff=-5.32
#   Row 4: EV=24.13, P(succ)=93.4%, R_succ=26.10, R_cliff=-3.77  <-EV
#   Row 5: EV=22.01, P(succ)=55.7%, R_succ=40.75, R_cliff=-1.50  <-CPT
#
# EV margin: 8.8% (row 4 vs row 5), CPT margin: 4.8%
# Phase 3: REINFORCE vs CPT-PG comparison

env:
  shape: [7, 7]
  stochasticity: windy
  reward_cliff: 3
  reward_step: -1
  reward_goal: 100
  wind_prob: 0.11

training:
  timesteps: 1500000
  n_eval_episodes: 20
  batch_size: 64
  entropy_coef: 0.5
  entropy_coef_final: 0.05
  n_seeds: 8

agent_config:
  lr: 0.0005
  gamma: 0.90
  baseline_type: ema
  alpha: 0.88
  beta: 0.88
  lambda_: 2.25
  reference_point: 40.75
  w_plus_gamma: 0.61
  w_minus_gamma: 0.69
  center_phi: true
  augmented_state: false

agents:
  - reinforce
  - cpt-pg
